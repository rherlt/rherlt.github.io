<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 200">
   <g fill="none" stroke="#00cdff" stroke-width="2" stroke-linecap="round">
     <!-- Main tower shaft -->
     <line x1="30" y1="10" x2="30" y2="180"/>
     
     <!-- Tower base (wider) -->
     <line x1="20" y1="180" x2="40" y2="180" stroke-width="3"/>
     
     <!-- Observation sphere (larger, more prominent) -->
     <circle cx="30" cy="80" r="20"/>
     <line x1="10" y1="80" x2="50" y2="80"/>
     
     <!-- Sphere support structure -->
     <line x1="25" y1="100" x2="25" y2="160"/>
     <line x1="35" y1="100" x2="35" y2="160"/>
     
     <!-- Antenna at top -->
     <line x1="30" y1="10" x2="30" y2="30" stroke-width="3"/>
     
     <!-- Additional structural details -->
     <line x1="28" y1="40" x2="32" y2="40"/>
     <line x1="26" y1="50" x2="34" y2="50"/>
     
     <!-- Base platform -->
     <line x1="22" y1="170" x2="38" y2="170"/>
     <line x1="24" y1="175" x2="36" y2="175"/>
     
     <!-- Decorative elements on sphere -->
     <line x1="30" y1="70" x2="30" y2="90"/>
     <line x1="20" y1="80" x2="20" y2="95"/>
     <line x1="40" y1="80" x2="40" y2="95"/>
   </g>
</svg>
